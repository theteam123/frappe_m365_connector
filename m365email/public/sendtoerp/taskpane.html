<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Send to ERP</title>
	<script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
	<script src="msal-browser.min.js"></script>
	<link rel="stylesheet" href="taskpane.css?v=12" />
</head>
<body>
	<main id="app">
		<!-- Sign-in view (Microsoft 365) -->
		<section id="loginView" class="view hidden">
			<span id="envLabelLogin" class="env"></span>
			<h1>Send to ERP</h1>
			<p id="loginStatus" class="muted">Signing in with Microsoft 365…</p>
			<button id="loginBtn" class="primary hidden">Sign in with Microsoft 365</button>
			<p id="loginError" class="error"></p>
		</section>

		<!-- Filing view -->
		<section id="fileView" class="view hidden">
			<header class="topbar">
				<span id="envLabel" class="env"></span>
				<span id="whoami" class="muted"></span>
				<button type="button" id="signOutBtn" class="link topbar-action" title="Forget this sign-in on this device">Sign out</button>
			</header>

			<h1>Send to ERP</h1>

			<fieldset>
				<legend>What to file</legend>
				<label class="check"><input id="saveEmail" type="checkbox" checked /> The email itself</label>
				<div id="attachmentList" class="attachments"></div>
				<p id="noAttachments" class="muted hidden">No file attachments on this email.</p>
			</fieldset>

			<fieldset>
				<legend>Where to file it</legend>
				<label for="doctype">Type</label>
				<select id="doctype"></select>
				<label for="search" id="findLabel">Find record</label>
				<input id="search" type="text" placeholder="Start typing…" autocomplete="off" />
				<ul id="results" class="results"></ul>
				<button type="button" id="createNew" class="link hidden"></button>
				<p id="chosen" class="chosen hidden"></p>
				<p id="suggestion" class="muted hidden" role="status"></p>

				<!-- The person this email is about: a forwarded email's original sender, editable -->
				<div id="personFields" class="hidden">
					<label for="contactSearch">Contact</label>
					<p id="personHint" class="muted hint"></p>
					<p id="contactChosen" class="chosen hidden"></p>
					<input id="contactSearch" type="text" placeholder="Search contacts to change…" autocomplete="off" />
					<ul id="contactResults" class="results"></ul>
				</div>
				<div id="personEdit" class="hidden">
					<p id="personEditHint" class="muted hint"></p>
					<label for="personName">Name</label>
					<input id="personName" type="text" autocomplete="off" />
					<label for="personEmail">Email</label>
					<input id="personEmail" type="email" autocomplete="off" />
				</div>

				<!-- Create new Supplier Quote: the job, and the supplier when it is not known -->
				<div id="quoteFields" class="hidden">
					<label for="projectSearch">Job</label>
					<input id="projectSearch" type="text" placeholder="Search jobs…" autocomplete="off" />
					<ul id="projectResults" class="results"></ul>
					<p id="projectChosen" class="chosen hidden"></p>
					<label for="supplierSearch">Supplier</label>
					<p id="supplierHint" class="muted hint"></p>
					<input id="supplierSearch" type="text" placeholder="Search suppliers…" autocomplete="off" />
					<ul id="supplierResults" class="results"></ul>
					<p id="supplierChosen" class="chosen hidden"></p>
				</div>
			</fieldset>

			<!-- Purchase Order: enter the email as a supplier invoice against the order -->
			<fieldset id="invoiceFields" class="hidden">
				<legend>Supplier invoice</legend>
				<label class="check"><input id="enterInvoice" type="checkbox" /> Enter as a supplier invoice</label>
				<div id="invoiceInputs">
					<label for="invoiceNumber">Supplier invoice number</label>
					<input id="invoiceNumber" type="text" autocomplete="off" />
					<label for="invoiceDate">Invoice date</label>
					<input id="invoiceDate" type="date" />
					<label for="dueDate">Due date</label>
					<input id="dueDate" type="date" />
					<p class="muted hint">The draft gets every line not yet invoiced on the order. Check it in ERP.</p>
				</div>
			</fieldset>

			<fieldset>
				<legend>Comment <span class="muted">(optional)</span></legend>
				<textarea id="comment" rows="2" placeholder="Add a note…"></textarea>
			</fieldset>

			<button id="fileBtn" class="primary" disabled>Attach to ERP</button>
			<p id="status" class="status" role="status"></p>
			<button type="button" id="openRecord" class="link hidden">Open in ERP ↗</button>
		</section>
	</main>

	<script src="taskpane.js?v=12"></script>
</body>
</html>
